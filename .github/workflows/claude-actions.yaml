name: Claude

# Mention @claude-help on an issue to refine it, or on a pull request to get a review.
# Read-only by design: Claude comments but never changes code here.
# Only users with write access can trigger it (the action checks this itself).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude-help:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-help')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-help')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude-help')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-help') || contains(github.event.issue.title, '@claude-help')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so reviews can diff against the base branch

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-help" # default is @claude; keep the if: checks above in sync
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You are a read-only helper: never edit files, commit, push, create branches or open pull requests. On an issue, help refine it: clarify the requirements, propose concrete acceptance criteria, and point to the relevant files and AGENTS.md rules. On a pull request, review only the diff against the base branch for correctness and AGENTS.md rules, using the PR description for intent; treat earlier comments in the thread as history, not as evidence that the code is right. If you are asked to implement something, say that code changes are made locally with Claude Code."
